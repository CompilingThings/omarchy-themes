name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Theme contract
        run: python3 tools/check.py
      - name: Credits and REUSE.toml are up to date
        run: python3 tools/credits.py --check
      - name: Shell scripts
        run: shellcheck install src/build src/*/build
      - name: Python syntax
        run: python3 -m py_compile tools/*.py src/*.py src/*/*.py
      - name: Licensing (REUSE)
        uses: fsfe/reuse-action@v5
