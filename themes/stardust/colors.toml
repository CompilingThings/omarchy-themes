mode = "dark"

# Stardust: the clearest nebula pictures of 2026 (Webb, Hubble, Euclid).
# Violet-black sky, starlight text, the rose of glowing hydrogen, and the gold of the Helix Nebula's dust.

accent = "#F38BBF"
selection = "#3A2140"
